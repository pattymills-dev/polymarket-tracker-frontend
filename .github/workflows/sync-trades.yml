name: Sync Polymarket Trades

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allow manual trigger

# Prevent concurrent runs from cancelling each other
concurrency:
  group: sync-trades
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Polymarket CLI
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.polymarket
            /usr/local/bin/polymarket
          key: polymarket-cli-v1

      - name: Install Polymarket CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://raw.githubusercontent.com/Polymarket/polymarket-cli/main/install.sh | sh
          echo "$HOME/.polymarket/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Add CLI to PATH
        if: steps.cli-cache.outputs.cache-hit == 'true'
        run: |
          echo "$HOME/.polymarket/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync trades from Polymarket
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            https://smuktlgclwvaxnduuinm.supabase.co/functions/v1/fetch-trades)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response: $body"
          echo "HTTP Status: $http_code"
          if [ "$http_code" -ge 400 ]; then
            echo "Error: fetch-trades failed with status $http_code"
            exit 1
          fi

      - name: Populate markets from trades
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            https://smuktlgclwvaxnduuinm.supabase.co/functions/v1/populate-markets-from-trades)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response: $body"
          echo "HTTP Status: $http_code"
          if [ "$http_code" -ge 400 ]; then
            echo "Error: populate-markets failed with status $http_code"
            exit 1
          fi

      - name: Sync market resolutions (recent trades)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://smuktlgclwvaxnduuinm.supabase.co/functions/v1/sync-market-resolutions?batch=200&mode=recent&force_fallback=1")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response (recent): $body"
          echo "HTTP Status: $http_code"
          if [ "$http_code" -ge 400 ]; then
            echo "Error: sync-resolutions (recent) failed with status $http_code"
            exit 1
          fi

      - name: Sync crypto updown resolutions (recent window)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://smuktlgclwvaxnduuinm.supabase.co/functions/v1/sync-market-resolutions?batch=200&mode=updown_window&window_hours=48&recheck_minutes=5")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response (updown_window): $body"
          echo "HTTP Status: $http_code"
          if [ "$http_code" -ge 400 ]; then
            echo "Error: sync-resolutions (updown_window) failed with status $http_code"
            exit 1
          fi

      - name: Sync sports event resolutions (recent)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://smuktlgclwvaxnduuinm.supabase.co/functions/v1/sync-market-resolutions?batch=25&mode=events_recent&days=3&force_fallback=1")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response (events_recent): $body"
          echo "HTTP Status: $http_code"
          if [ "$http_code" -ge 400 ]; then
            echo "Error: sync-resolutions (events_recent) failed with status $http_code"
            exit 1
          fi

      - name: Sync sports event resolutions (window)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://smuktlgclwvaxnduuinm.supabase.co/functions/v1/sync-market-resolutions?batch=100&mode=events_window&days=5&recheck_hours=1&force_fallback=1")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response (events_window): $body"
          echo "HTTP Status: $http_code"
          if [ "$http_code" -ge 400 ]; then
            echo "Error: sync-resolutions (events_window) failed with status $http_code"
            exit 1
          fi

      - name: Sync sports event resolutions (due)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://smuktlgclwvaxnduuinm.supabase.co/functions/v1/sync-market-resolutions?batch=10&mode=events_due&recheck_hours=2&force_fallback=1")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response (events_due): $body"
          echo "HTTP Status: $http_code"
          if [ "$http_code" -ge 400 ]; then
            echo "Error: sync-resolutions (events_due) failed with status $http_code"
            exit 1
          fi

      - name: Recheck due market resolutions
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://smuktlgclwvaxnduuinm.supabase.co/functions/v1/sync-market-resolutions?batch=200&mode=due&recheck_hours=2&force_fallback=1")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response (due): $body"
          echo "HTTP Status: $http_code"
          if [ "$http_code" -ge 400 ]; then
            echo "Error: sync-resolutions (due) failed with status $http_code"
            exit 1
          fi

      - name: Refresh copyable traders (30-day win/loss stats)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://smuktlgclwvaxnduuinm.supabase.co/functions/v1/refresh-copyable-traders?mode=existing&limit=50&days=30")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response (copyable refresh): $body"
          echo "HTTP Status: $http_code"
          if [ "$http_code" -ge 400 ]; then
            echo "Error: refresh-copyable-traders failed with status $http_code"
            exit 1
          fi

      - name: Refresh top traders (all-time win/loss stats)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://smuktlgclwvaxnduuinm.supabase.co/functions/v1/refresh-top-traders?limit=50&min_resolved=5")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response (top traders refresh): $body"
          echo "HTTP Status: $http_code"
          if [ "$http_code" -ge 400 ]; then
            echo "Error: refresh-top-traders failed with status $http_code"
            exit 1
          fi

      - name: CLI Trader Portfolio Validation
        continue-on-error: true
        run: bash .github/scripts/cli-portfolio-validation.sh
        env:
          SUPABASE_URL: https://smuktlgclwvaxnduuinm.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run paper copy trading
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://smuktlgclwvaxnduuinm.supabase.co/functions/v1/run-paper-copy")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response (paper copy): $body"
          echo "HTTP Status: $http_code"
          # Don't fail on 503 (stale data warning) - just log it
          if [ "$http_code" -ge 400 ] && [ "$http_code" -ne 503 ]; then
            echo "Error: run-paper-copy failed with status $http_code"
            exit 1
          fi

      - name: Sync resolutions for open paper positions (priority)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://smuktlgclwvaxnduuinm.supabase.co/functions/v1/sync-market-resolutions?mode=paper_open&recheck_hours=0")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response (paper_open): $body"
          echo "HTTP Status: $http_code"
          if [ "$http_code" -ge 400 ]; then
            echo "Error: sync-resolutions (paper_open) failed with status $http_code"
            exit 1
          fi

      - name: Settle paper positions
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://smuktlgclwvaxnduuinm.supabase.co/functions/v1/settle-paper-positions")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response (settle positions): $body"
          echo "HTTP Status: $http_code"
          if [ "$http_code" -ge 400 ]; then
            echo "Error: settle-paper-positions failed with status $http_code"
            exit 1
          fi
